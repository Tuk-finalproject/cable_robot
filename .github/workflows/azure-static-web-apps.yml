name: CableWorm 웹앱 배포

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - '.github/workflows/azure-static-web-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-web-apps-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: 프론트엔드 설치 및 빌드
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          cd front
          npm ci
          npm run build
          test -s dist/index.html
          node -e "JSON.parse(require('node:fs').readFileSync('dist/staticwebapp.config.json','utf8'))"

      - name: Azure 배포 연결 확인
        id: azure
        shell: bash
        env:
          AZURE_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$AZURE_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Azure 배포 토큰이 설정되지 않아 배포를 건너뜁니다."
            echo "### 배포 대기" >> "$GITHUB_STEP_SUMMARY"
            echo "웹앱 빌드는 완료됐습니다. server/AZURE_SETUP.md에 따라 AZURE_STATIC_WEB_APPS_API_TOKEN을 등록한 뒤 main에서 다시 실행하세요." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Azure에 웹앱 배포
        if: steps.azure.outputs.ready == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: front/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          production_branch: main
